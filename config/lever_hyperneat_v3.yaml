# Lever test (poc2.5, HyperNEAT V3): identical to config/lever_hyperneat_v2.yaml
# (weight_scale 3.0 -> 0.5, the fix that eliminated founder saturation), ONE
# more thing changed — hyperneat.bootstrap_hidden_nodes 0 -> 1.
#
# V2's own campaign (docs/FALSIFIED-hyperneat.md) found founder saturation was
# fixed (no more demographic collapse) but competence stayed near the floor
# (15%->19%, still -48 vs the 67% direct-encoding default): `hidden` averaged
# 0.05-0.17 after 15k ticks — the CPPN founder starts with 0 hidden nodes, so
# it's a PURELY LINEAR map from 6 inputs to 1 weight. Every substrate weight
# is then a (cos, sin, z)-weighted sum of the SAME 6 CPPN weights: mutating
# any one of them moves every substrate connection at once (a highly-coupled,
# low-dimensional landscape), and it can only ever express a single first-
# order (sinusoidal) pattern across the ray ring — never a localised/
# thresholded one (e.g. "strong response from front-left rays only"), which
# needs a nonlinearity a direct-encoding genome gets for free (98 independent
# weights, no shared basis).
#
# V3's lever: give the CPPN founder ONE hidden node at genesis (via the exact
# same `Genome.add_node` operator already used for in-life mutation — no new
# machinery, classic NEAT split: in->new gets weight 1.0, new->out inherits
# the original weight), instead of waiting on `add_node_rate` (0.03/tick) to
# maybe stumble into one over 15-30k ticks. A fresh 0-tick founder sweep
# (tests/test_hyperneat.py::test_bootstrap_hidden_nodes_adds_nonlinearity_...)
# confirms this doesn't reintroduce degenerate founders (steer_score never
# exactly 0.0, same as V2 alone) — this is an evolvability lever, not another
# founder-saturation fix; V2 already zeroed that out.
#
# Decided with Robin (2026-07-16): campaign run directly at 30k ticks (not
# 15k then re-validate), since the last structural lever (density,
# docs/RESULTS-density.md) was negative at 15k but flipped positive at 30k —
# a single hidden node changes only 2 of the CPPN's ~8-14 connections
# (in->new, new->out, minus the split original), a slow structural change
# that may need the extra generations to show up, same reasoning.
#
# Default simulation configuration.
# Promoted from config/apple_repro_bigpop.yaml (poc2.2 ÉTAPE 10) after the poc2.3
# sensor ablation (docs/Audits/AUDIT-poc2.3.md volet 5): the 67-input layout is
# NOT robust (seed 123 : 43%→1% foraging) — no single added channel explains it,
# adding inputs itself destabilises the fully-connected initial genome. The
# 49-input legacy layout is the only one that reproduces robust 3-seed foraging
# (86/77/42 at 15k ; 86/84/56 at 30k, cf. audit). Priority = agent performance.
# Energy is expressed in apple-equivalent units (invariant n°2).

world:
  width: 3200          # pixels (2263 * sqrt(2), rounded)
  height: 1800          # pixels (1273 * sqrt(2), rounded)

penalty_zone:
  width: 141           # thickness from the wall, in pixels
  max_drain: 0.003     # energy drained per tick at the wall (softened: was 0.005)

agent:
  radius: 11.31
  max_speed: 2.122      # halved (was 4.243) — less ground swept per tick, see header
  initial_energy: 1.0
  max_energy: 2.0
  energy_drain_per_tick: 0.0004   # ~2500 ticks of grace unfed (was 0.001 → 1000)
  max_age: 5000        # ticks
  reproduction_threshold: 1.1     # ~1 apple from start → birth; high-r bootstrap (was 1.3)
  reproduction_cost: 0.35         # more offspring per apple keeps the pop viable (was 0.6)
  end_of_life_ticks: 500
  max_turn_rate: 0.2              # rad/tick egocentric cap control (~11°/tick)
  move_cost: 0.0                  # energy/tick per unit forward speed (0.0 = free)
  apples_per_offspring: 1.5      # >0 = fecundity from cumulative apples (structural)

sensors:
  num_rays: 16
  max_distance: 283    # pixels
  fov: 360             # degrees
  split_distance: false   # legacy layout: 1 combined nearest-object distance/ray
  proprioception: false   # legacy layout: no actual_speed input
  apples_in_view: false   # legacy layout: no apples_in_view input

network:
  num_inputs: 49        # 3*num_rays + 1 : dist, apple_flag, wall_flag (×16) + energy
  num_outputs: 2         # vx_brut, vy_brut (normalised post-output)
  activation: "tanh"

apple:
  count: 160            # denser food → random walkers stumble on it sooner (was 50)
  radius: 7.07
  energy: 0.5
  respawn_delay: 150   # ticks before an eaten apple reappears (CDC §5.2)

genome:
  weight_init_range: 1.0
  weight_mutation_rate: 0.15
  weight_perturbation: 0.05
  add_node_rate: 0.03
  add_connection_rate: 0.05
  remove_node_rate: 0.01
  remove_connection_rate: 0.02
  weight_max: 5.0               # clamp after mutation (anti-saturation tanh)
  crossover_rate: 0.0          # P(birth is sexual, intra-species); 0.0 = asexual

speciation:
  # NEAT compatibility-distance coefficients (Stanley & Miikkulainen 2002).
  # Under HyperNEAT this measures CPPN structural distance (6->1 topology,
  # +1 bootstrapped hidden node), not the substrate's — same mechanism,
  # different genotype. fitness_sharing stays off (never promoted, see
  # config/lever_fitness_sharing.yaml).
  c_excess: 1.0
  c_disjoint: 1.0
  c_weight: 0.4
  compatibility_threshold: 3.0   # genomes closer than this share a species
  fitness_sharing: false

# Additive behavioural-novelty bonus — kept ON (default.yaml value) so this
# lever isolates ONE change (hyperneat.bootstrap_hidden_nodes) against V2,
# not a reversion to a pre-novelty baseline.
novelty:
  enabled: true
  weight: 1.0
  neighbors: 15
  recompute_interval: 10

# HyperNEAT V3 (poc2.5): V2's weight_scale=0.5 kept as-is (fixes founder
# saturation), + bootstrap_hidden_nodes 0 -> 1 (see header for the diagnosis).
hyperneat:
  enabled: true
  weight_scale: 0.5
  bootstrap_hidden_nodes: 1

population:
  initial_size: 200        # large initial pool → more random walkers find food naturally
  max_size: 400            # accommodate growth from successful hunters

simulation:
  ticks_per_second: 60
  max_ticks: 0         # 0 = run forever
  seed: 42

logging:
  csv_path: "logs/metrics.csv"
  log_interval_ticks: 100
  best_genome_path: "logs/best_genome.json"

render:
  fps: 60
  window_width: 3200
  window_height: 1800
