# Lever test (poc2.4, 2026-07-10): minimal-criterion reproduction + soft
# population band. Robin's ask: stop reproduction being a per-tick refill of
# whatever just died (population pinned at max_size), let it fire only for
# genuinely competent profiles, and let the population float in a 400-500 band
# instead of being pinned at the cap. Grounded in the non-episodic
# neuroevolution / minimal-criterion literature (Soros & Stanley 2016 "How the
# Strictness of the Minimal Criterion Impacts Open-Ended Evolution";
# arXiv:2302.09334 "Eco-evolutionary Dynamics of Non-episodic Neuroevolution"):
# agents reproduce on a SUSTAINED viability criterion, not instantaneous
# competition, up to a soft cap the population floats below.
#
# TWO changes vs default.yaml, both on the reproduction rule ONLY:
#   - agent.reproduction_min_ticks: 1000 — must hold credit >= apples_per_offspring
#     for that many consecutive ticks before ONE birth, then a refractory reset.
#     Proof of durable foraging, and no more frenetic refill.
#   - population.max_size: 500 — raises the ceiling so the gated birth rate lets
#     the population settle in a band below it rather than pinned at 400.
# population.initial_size unchanged (200). NOT reducing population — poc2.2
# ÉTAPES 7-10 established that a smaller pop reopens founder drift; the point
# here is a floating band under a HIGHER cap, driven by competence, not a
# smaller pop.
#
# STATUS (2026-07-10): mechanism wired + fully tested, NOT promoted. Session
# cut short before the deciding campaign. Findings so far:
#  - Population-band sweep (single seed, 10k): min_ticks 60/150/300/600 all PIN
#    the pop at the 500 cap (mean ~485-495) — i.e. DENSER than the 400 default,
#    the opposite of the anti-crowding goal. Only min_ticks >= ~1000 makes the
#    population genuinely float (mean ~422, range 241-500). So the "floating
#    band" the ask wants requires STRONG gating; hence 1000 here.
#  - Forager% campaign (6 seeds/15k) vs the current default's 58% @ 15k:
#    min_ticks 300 -> 59%, 600 -> 58% (both neutral, but both pin at 500).
#    min_ticks 1000 -> NOT MEASURED (campaign cut). 15k likely undersells (the
#    density lever was also flat at 15k, +4 only at 30k), so a 30k campaign at
#    1000 is the real next test.
# Default.yaml keeps reproduction_min_ticks absent (=> 0, legacy). Resume by
# running: python -m tools.campaign config/lever_min_criterion.yaml 30000
# 42,7,123,1,5,99  (compare vs default at 30k; watch pop stays in a band and
# forager% >= 66).
#
# Default simulation configuration.
# Promoted from config/apple_repro_bigpop.yaml (poc2.2 ÉTAPE 10) after the poc2.3
# sensor ablation (docs/Audits/AUDIT-poc2.3.md volet 5): the 67-input layout is
# NOT robust (seed 123 : 43%→1% foraging) — no single added channel explains it,
# adding inputs itself destabilises the fully-connected initial genome. The
# 49-input legacy layout is the only one that reproduces robust 3-seed foraging
# (86/77/42 at 15k ; 86/84/56 at 30k, cf. audit). Priority = agent performance.
# Energy is expressed in apple-equivalent units (invariant n°2).
#
# world/agent.max_speed PROMOTED from config/lever_bigmap_slow.yaml (poc2.4,
# 2026-07-10): Robin flagged live overcrowding (apples eaten within ~0.2s,
# mostly by undirected collision, not steering — confirmed by
# tools/apple_capture_probe). world ×√2 (thins static density) + max_speed
# halved (thins per-tick sweep, so fewer random-walk collisions) fixes the
# symptom directly (apple lifetime median 14→58 ticks) and, validated over
# 30k ticks / 6 seeds, nets POSITIVE on the forager-% benchmark too (62%→66%,
# seed 1 : 23%→58%) even though the same lever was mean-negative at 15k
# (agents eat less per tick, so foraging selection needs more ticks to show).
# See docs/RESULTS-density.md.

world:
  width: 3200          # pixels (2263 * sqrt(2), rounded)
  height: 1800          # pixels (1273 * sqrt(2), rounded)

penalty_zone:
  width: 141           # thickness from the wall, in pixels
  max_drain: 0.003     # energy drained per tick at the wall (softened: was 0.005)

agent:
  radius: 11.31
  max_speed: 2.122      # halved (was 4.243) — less ground swept per tick, see header
  initial_energy: 1.0
  max_energy: 2.0
  energy_drain_per_tick: 0.0004   # ~2500 ticks of grace unfed (was 0.001 → 1000)
  max_age: 5000        # ticks
  reproduction_threshold: 1.1     # ~1 apple from start → birth; high-r bootstrap (was 1.3)
  reproduction_cost: 0.35         # more offspring per apple keeps the pop viable (was 0.6)
  end_of_life_ticks: 500
  max_turn_rate: 0.2              # rad/tick egocentric cap control (~11°/tick)
  move_cost: 0.0                  # energy/tick per unit forward speed (0.0 = free)
  apples_per_offspring: 3.0      # >0 = fecundity from cumulative apples (structural)
  reproduction_min_ticks: 1000   # sustained-credit gate, see header — 0 (off) in default

sensors:
  num_rays: 16
  max_distance: 283    # pixels
  fov: 360             # degrees
  split_distance: false   # legacy layout: 1 combined nearest-object distance/ray
  proprioception: false   # legacy layout: no actual_speed input
  apples_in_view: false   # legacy layout: no apples_in_view input

network:
  num_inputs: 49        # 3*num_rays + 1 : dist, apple_flag, wall_flag (×16) + energy
  num_outputs: 2         # vx_brut, vy_brut (normalised post-output)
  activation: "tanh"

apple:
  count: 160            # denser food → random walkers stumble on it sooner (was 50)
  radius: 7.07
  energy: 0.5
  respawn_delay: 150   # ticks before an eaten apple reappears (CDC §5.2)

genome:
  weight_init_range: 1.0
  weight_mutation_rate: 0.15
  weight_perturbation: 0.05
  add_node_rate: 0.03
  add_connection_rate: 0.05
  remove_node_rate: 0.01
  remove_connection_rate: 0.02
  weight_max: 5.0               # clamp after mutation (anti-saturation tanh)
  crossover_rate: 0.0          # P(birth is sexual, intra-species); 0.0 = asexual

speciation:
  # NEAT compatibility-distance coefficients (Stanley & Miikkulainen 2002).
  # Used to count species + measure genetic diversity in the metrics CSV, and
  # (only when fitness_sharing: true) to divide reproduction priority by
  # species size. fitness_sharing defaults to false: observability only, same
  # as before — not yet promoted (needs a validated 3-seed campaign, see
  # config/lever_fitness_sharing.yaml).
  c_excess: 1.0
  c_disjoint: 1.0
  c_weight: 0.4
  compatibility_threshold: 3.0   # genomes closer than this share a species
  fitness_sharing: false

# Additive behavioural-novelty bonus on reproduction priority (novelty search,
# Lehman & Stanley 2011). PROMOTED to default in poc2.4: the first lever to lift
# every seed without regressing any — validated 6-seed campaign (15k), mean
# foragers 52% -> 62% (+10), seeds the baseline nearly fails (1:9->27, 99:6->25)
# helped most. Additive (never penalises), unlike the falsified reducer levers.
# weight=1.0 is the swept optimum (0.5-1.0 plateau; 2.0 over-dilutes foraging).
# recompute_interval=10 amortises the O(pop^2) scoring back to baseline speed
# with no loss of gain. See docs/RESULTS-novelty.md and config/lever_novelty.yaml.
novelty:
  enabled: true
  weight: 1.0
  neighbors: 15
  recompute_interval: 10

population:
  initial_size: 200        # large initial pool → more random walkers find food naturally
  max_size: 500            # raised (was 400) — soft cap the pop floats below, see header

simulation:
  ticks_per_second: 60
  max_ticks: 0         # 0 = run forever
  seed: 42

logging:
  csv_path: "logs/metrics.csv"
  log_interval_ticks: 100
  best_genome_path: "logs/best_genome.json"

render:
  fps: 60
  window_width: 3200
  window_height: 1800
