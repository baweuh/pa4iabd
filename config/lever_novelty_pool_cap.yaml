# Lever test (poc3 perf addendum): identical to config/default.yaml, ONE
# thing changed — novelty.max_pool_size 0 -> 380.
#
# 2nd iteration: the first test (max_pool_size=300, 75% of pop=400)
# degraded mean foragers 79%->67% (-12), a real effect not noise — 5/6
# seeds down, worst seed (99) dropped 26 points. Retesting with a much
# lighter cap (380, 95% of pop=400 — only 20 agents ever excluded from
# comparison) to see whether the degradation shrinks as the cap approaches
# the full population, before deciding whether max_pool_size can be
# trusted at the target scale (pop=4000) at all.
#
# Default simulation configuration.
world:
  width: 3200
  height: 1800

penalty_zone:
  width: 141
  max_drain: 0.003

agent:
  radius: 11.31
  max_speed: 2.122
  initial_energy: 1.0
  max_energy: 2.0
  energy_drain_per_tick: 0.0004
  max_age: 5000
  reproduction_threshold: 1.1
  reproduction_cost: 0.35
  end_of_life_ticks: 500
  max_turn_rate: 0.2
  move_cost: 0.0
  apples_per_offspring: 1.5

sensors:
  num_rays: 16
  max_distance: 283
  fov: 360
  split_distance: false
  proprioception: false
  apples_in_view: false

network:
  num_inputs: 49
  num_outputs: 2
  activation: "tanh"
  hidden_size: 0

apple:
  count: 160
  radius: 7.07
  energy: 0.5
  respawn_delay: 150

genome:
  weight_init_range: 1.0
  weight_mutation_rate: 0.15
  weight_perturbation: 0.05
  weight_max: 5.0
  crossover_rate: 0.0

speciation:
  c_weight: 0.4
  compatibility_threshold: 3.0
  fitness_sharing: false

# poc3 perf addendum: the only variable changed vs default.yaml.
novelty:
  enabled: true
  weight: 1.0
  neighbors: 15
  recompute_interval: 10
  max_pool_size: 380

population:
  initial_size: 200
  max_size: 400

simulation:
  ticks_per_second: 60
  max_ticks: 0
  seed: 42

logging:
  csv_path: "logs/metrics.csv"
  log_interval_ticks: 100
  best_genome_path: "logs/best_genome.json"

render:
  fps: 60
  window_width: 3200
  window_height: 1800
