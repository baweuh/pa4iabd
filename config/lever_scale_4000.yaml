# Lever test (poc3 — the actual point of this branch): identical to
# config/default.yaml, ONE thing changed — population.max_size 400 -> 4000
# (initial_size scaled in the same 0.5 ratio, 200 -> 2000).
#
# This is the real test of the hypothesis that motivated poc3: Hamon et al.
# (2023) and Bejjani et al. (2025) — same non-episodic, implicit-selection
# paradigm as this project — found complex behaviour emerges only above a
# population/environment scale threshold, never below it. This project's
# own history backs the same direction: 11 selection/reproduction
# mechanisms falsified, the only 4 positive levers were all scale/ecology
# (population 200->400, K-sweep, density, novelty).
#
# Deliberately world/apple/sensors UNCHANGED (one variable at a time, as
# always in this project) — 4000 agents competing for the same 160 apples
# in the same 3200x1800 world is a MUCH denser environment than the
# default. That's a known confound to keep in mind reading the result: a
# regression here could mean "scale doesn't help" OR "not enough food to
# go around at this density" — not distinguishable from this run alone.
#
# novelty stays EXACT (no max_pool_size) — validated tractable at this
# population (11.1 ticks/s measured, ~45min/seed at 30k ticks) and
# max_pool_size was found to measurably change results even at pop=400
# (79%->67% at cap=300, 79%->72% at cap=380, neither closing the gap
# cleanly) — not trustworthy without further validation, and not needed
# at this scale anyway.
world:
  width: 3200
  height: 1800

penalty_zone:
  width: 141
  max_drain: 0.003

agent:
  radius: 11.31
  max_speed: 2.122
  initial_energy: 1.0
  max_energy: 2.0
  energy_drain_per_tick: 0.0004
  max_age: 5000
  reproduction_threshold: 1.1
  reproduction_cost: 0.35
  end_of_life_ticks: 500
  max_turn_rate: 0.2
  move_cost: 0.0
  apples_per_offspring: 1.5

sensors:
  num_rays: 16
  max_distance: 283
  fov: 360
  split_distance: false
  proprioception: false
  apples_in_view: false

network:
  num_inputs: 49
  num_outputs: 2
  activation: "tanh"
  hidden_size: 0

apple:
  count: 160
  radius: 7.07
  energy: 0.5
  respawn_delay: 150

genome:
  weight_init_range: 1.0
  weight_mutation_rate: 0.15
  weight_perturbation: 0.05
  weight_max: 5.0
  crossover_rate: 0.0

speciation:
  c_weight: 0.4
  compatibility_threshold: 3.0
  fitness_sharing: false

novelty:
  enabled: true
  weight: 1.0
  neighbors: 15
  recompute_interval: 10

# poc3 scale chantier: the only variable changed vs default.yaml.
population:
  initial_size: 2000
  max_size: 4000

simulation:
  ticks_per_second: 60
  max_ticks: 0
  seed: 42

logging:
  csv_path: "logs/metrics.csv"
  log_interval_ticks: 100
  best_genome_path: "logs/best_genome.json"

render:
  fps: 60
  window_width: 3200
  window_height: 1800
