# Lever test (poc3 — scale chantier, round 2): identical to
# config/lever_scale_4000.yaml, ONE further thing changed — apple.count
# 160 -> 1600 (x10, same ratio as population.max_size 400 -> 4000).
#
# Round 1 (lever_scale_4000.yaml) confounded two things: "more agents" and
# "much less food per agent" (4000 agents / 160 apples = 5x denser
# competition than the 400/160 default). Result was a clear regression
# (mean foragers 72%->38%, 3/6 seeds with negative median steer score) but
# NOT interpretable as a verdict on the scale hypothesis itself — population
# never even grew past initial_size (2000), consistent with starvation
# capping growth before density/scale effects could be observed.
#
# This config isolates that confound: apples-per-capita is restored to the
# same ratio as default.yaml (1600/4000 = 160/400 = 0.4), so a regression
# here can no longer be blamed on "not enough food to go around". Agent
# spatial density (agents per unit area, world size unchanged) stays
# elevated by construction — that IS the scale being tested, not a
# confound to remove.
#
# novelty stays EXACT (no max_pool_size), same reasoning as round 1 —
# untested/untrustworthy at this scale, not needed for tractability here.
world:
  width: 3200
  height: 1800

penalty_zone:
  width: 141
  max_drain: 0.003

agent:
  radius: 11.31
  max_speed: 2.122
  initial_energy: 1.0
  max_energy: 2.0
  energy_drain_per_tick: 0.0004
  max_age: 5000
  reproduction_threshold: 1.1
  reproduction_cost: 0.35
  end_of_life_ticks: 500
  max_turn_rate: 0.2
  move_cost: 0.0
  apples_per_offspring: 1.5

sensors:
  num_rays: 16
  max_distance: 283
  fov: 360
  split_distance: false
  proprioception: false
  apples_in_view: false

network:
  num_inputs: 49
  num_outputs: 2
  activation: "tanh"
  hidden_size: 0

# poc3 scale chantier round 2: the only variable changed vs
# lever_scale_4000.yaml. x10 vs default.yaml's 160, same ratio as
# population.max_size 400 -> 4000.
apple:
  count: 1600
  radius: 7.07
  energy: 0.5
  respawn_delay: 150

genome:
  weight_init_range: 1.0
  weight_mutation_rate: 0.15
  weight_perturbation: 0.05
  weight_max: 5.0
  crossover_rate: 0.0

speciation:
  c_weight: 0.4
  compatibility_threshold: 3.0
  fitness_sharing: false

novelty:
  enabled: true
  weight: 1.0
  neighbors: 15
  recompute_interval: 10

# poc3 scale chantier: the only variable changed vs default.yaml (round 1).
population:
  initial_size: 2000
  max_size: 4000

simulation:
  ticks_per_second: 60
  max_ticks: 0
  seed: 42

logging:
  csv_path: "logs/metrics.csv"
  log_interval_ticks: 100
  best_genome_path: "logs/best_genome.json"

render:
  fps: 60
  window_width: 3200
  window_height: 1800
