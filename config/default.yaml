# Environnement
environment:
  width: 800
  height: 800
  zone_width: 60
  zone_max_drain: 0.05

# Pommes
food:
  count: 30
  respawn_delay: 150
  energy: 1.0

# Agents
agent:
  initial_population: 30
  max_speed: 2.0
  spawn_radius_child: 75
  lifespan_warning_ticks: 500

# Énergie
energy:
  base_drain_rate: 0.005
  bootstrap_initial_energy: 4.0
  child_initial_energy: 2.0
  reproduction_threshold: 5.0
  parent_energy_after_repro: 1.0
  max_lifespan: 10000

# Raycasts
raycasts:
  count: 16
  max_range: 200

# Mutations
mutations:
  mutate_weights_prob: 0.80
  weight_perturb_prob: 0.15
  weight_sigma: 0.2
  weight_reset_prob: 0.05
  add_connection_prob: 0.05
  add_node_prob: 0.03
  remove_connection_prob: 0.05
  remove_node_prob: 0.02

# Simulation
simulation:
  tick_rate: 60
  render_fps: 60
  log_interval: 100
  seed: 42
  headless: false