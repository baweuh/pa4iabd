# Default simulation configuration.
# Every value is a starting point; fine calibration happens in Phase 8.
# Energy is expressed in apple-equivalent units (invariant n°2).

world:
  width: 1600          # pixels
  height: 900          # pixels

penalty_zone:
  width: 100           # thickness from the wall, in pixels
  max_drain: 0.003     # energy drained per tick at the wall (softened: was 0.005)

agent:
  radius: 8
  max_speed: 3.0
  initial_energy: 1.0
  max_energy: 5.0
  energy_drain_per_tick: 0.0015   # ~2500 ticks of grace unfed (was 0.001 → 1000)
  max_age: 5000        # ticks
  reproduction_threshold: 1.1     # ~1 apple from start → birth; high-r bootstrap (was 1.3)
  reproduction_cost: 0.35         # more offspring per apple keeps the pop viable (was 0.6)
  end_of_life_ticks: 500
  max_turn_rate: 0.2              # rad/tick egocentric cap control (~11°/tick)
  move_cost: 0.0                  # energy/tick per unit forward speed (0.0 = free)
  apples_per_offspring: 0.0      # >0 = fecundity from cumulative apples (structural)

sensors:
  num_rays: 16
  max_distance: 200    # pixels
  fov: 360             # degrees

network:
  num_inputs: 49       # 3 * num_rays + 1 (dist + apple_flag + wall_flag per ray, + energy)
  num_outputs: 2       # vx_brut, vy_brut (normalised post-output)
  activation: "tanh"

apple:
  count: 80            # denser food → random walkers stumble on it sooner (was 50)
  radius: 5
  energy: 0.5
  respawn_delay: 150   # ticks before an eaten apple reappears (CDC §5.2)

genome:
  weight_init_range: 1.0
  weight_mutation_rate: 0.15
  weight_perturbation: 0.05
  add_node_rate: 0.03
  add_connection_rate: 0.05
  remove_node_rate: 0.01
  remove_connection_rate: 0.02
  weight_max: 5.0               # clamp after mutation (anti-saturation tanh)

speciation:
  # NEAT compatibility-distance coefficients (Stanley & Miikkulainen 2002).
  # Observability only: used to count species + measure genetic diversity in the
  # metrics CSV; never feed back into selection or reproduction.
  c_excess: 1.0
  c_disjoint: 1.0
  c_weight: 0.4
  compatibility_threshold: 3.0   # genomes closer than this share a species

population:
  initial_size: 100        # large initial pool → more random walkers find food naturally
  max_size: 200            # accommodate growth from successful hunters

simulation:
  ticks_per_second: 60
  max_ticks: 0         # 0 = run forever
  seed: 42

logging:
  csv_path: "logs/lever23/metrics.csv"
  log_interval_ticks: 100
  best_genome_path: "logs/best_genome.json"

render:
  fps: 60
  window_width: 1600
  window_height: 900
